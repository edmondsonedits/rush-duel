<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050509">
<title>Rush Duel Online V12</title>
<style>html,body{margin:0;min-height:100%;background:#03040a;color:#fff;font-family:monospace}.boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.boot b{color:#66ebff;font-size:20px}.boot span{display:block;margin-top:10px;color:#aab9d1;line-height:1.5}</style>
</head>
<body><div class="boot" id="boot"><div><b>RUSH DUEL ONLINE V12</b><span>Loading advanced Hard and Impossible bot intelligence…</span></div></div>
<script>
(async()=>{
  const BUILD='expert-bots-v12-20260801-0032';
  try{
    const response=await fetch('play-v11.html?source='+encodeURIComponent(BUILD),{cache:'no-store'});
    if(!response.ok)throw new Error('Could not load Online V11 foundation.');
    let launcher=await response.text();
    launcher=launcher.replaceAll('Rush Duel Online V11','Rush Duel Online V12');
    launcher=launcher.replaceAll('RUSH DUEL ONLINE V11','RUSH DUEL ONLINE V12');
    launcher=launcher.replace('Loading one-second settled-piece force rule…','Loading advanced Hard and Impossible bot intelligence…');
    launcher=launcher.replace('settled-force-v11-20260801-0050',BUILD);

    const marker="    html=html.replace(\"rush:'No Bot Rush'\",\"rush:'No Manual Bot Rush'\");\n`;";
    if(!launcher.includes(marker))throw new Error('Online V11 bot update point was not found.');

    const botPatches="\n    html=patch(html,'hard bot profile',\n      \"hard:{label:'HARD',reaction:560,step:170,drop:[1700,2700],forceChance:.52,choice:1,error:.015,timerBonus:0,copy:'The bot moves at a readable pace but evaluates the board very carefully and chooses consistently strong placements.'},\",\n      \"hard:{label:'HARD',reaction:360,step:95,drop:[1050,1750],forceChance:.72,choice:1,error:0,timerBonus:0,copy:'A two-piece search bot using advanced board features, attack planning, hole avoidance, and deterministic placements.'},\"\n    );\n    html=patch(html,'impossible bot profile',\n      \"impossible:{label:'IMPOSSIBLE',reaction:420,step:130,drop:[750,1400],forceChance:.90,choice:1,error:0,timerBonus:0,copy:'The bot is smart, deliberate, and relentless. It still moves visibly, but it uses Rush Drop far more often than the easier bots.'}\",\n      \"impossible:{label:'IMPOSSIBLE',reaction:220,step:58,drop:[540,950],forceChance:.98,choice:1,error:0,timerBonus:0,copy:'A deterministic three-piece beam-search bot that evaluates survival, clean stacking, line attacks, wells, transitions, holes, and future pieces.'}\"\n    );\n    html=patch(html,'expert difficulty presentation',\n      \"hard:{summary:'A smart rival that rushes often.',timer:'Standard Time',rush:'Frequent Rushes'},\\n    impossible:{summary:'Perfect placements and relentless rushes.',timer:'Standard Time',rush:'Maximum Rush'}\",\n      \"hard:{summary:'Two-piece search with advanced stack evaluation.',timer:'Standard Time',rush:'Strategic Rushes'},\\n    impossible:{summary:'Three-piece beam search with no intentional errors.',timer:'Standard Time',rush:'Maximum Pressure'}\"\n    );\n\n    html=patch(html,'expert bot planner',\n      \"  function chooseBotPlan(board,shapeIndex,difficulty){\\n    const d=DIFFICULTIES[difficulty], candidates=[];\\n    for(const rotation of ROTATIONS[shapeIndex]){\\n      for(let x=-2;x<COLS+2;x++){\\n        const c=simulatePlacement(board,shapeIndex,rotation,x);\\n        if(c)candidates.push(c);\\n      }\\n    }\\n    candidates.sort((a,b)=>b.score-a.score);\\n    if(!candidates.length)return {x:3,rot:0,m:cloneMatrix(SHAPES[shapeIndex].m),score:-999};\\n    let pool=Math.min(d.choice,candidates.length),pick=0;\\n    if(Math.random()<d.error) pick=Math.min(candidates.length-1,Math.floor(Math.random()*Math.max(2,pool+2)));\\n    else if(pool>1) pick=Math.floor(Math.pow(Math.random(),2)*pool);\\n    return candidates[pick];\\n  }\",\n      \"  function expertCanPlace(grid,m,x,y){\\n    for(let py=0;py<4;py++)for(let px=0;px<4;px++)if(m[py][px]){\\n      const gx=x+px,gy=y+py;\\n      if(gx<0||gx>=COLS||gy>=ROWS)return false;\\n      if(gy>=0&&grid[gy][gx])return false;\\n    }\\n    return true;\\n  }\\n\\n  function expertBoardFeatures(grid){\\n    const heights=Array(COLS).fill(0),rowsWithHoles=new Set();\\n    let holes=0,holeDepth=0,blocksAboveHoles=0,rowTransitions=0,columnTransitions=0,cumulativeWells=0;\\n    for(let x=0;x<COLS;x++){\\n      let first=-1,filledAbove=0,seenHole=false;\\n      for(let y=0;y<ROWS;y++){\\n        if(grid[y][x]){if(first<0)first=y;filledAbove++;if(seenHole)blocksAboveHoles++;}\\n        else if(first>=0){holes++;holeDepth+=filledAbove;rowsWithHoles.add(y);seenHole=true;}\\n      }\\n      heights[x]=first<0?0:ROWS-first;\\n    }\\n    for(let y=0;y<ROWS;y++){\\n      let previous=1;\\n      for(let x=0;x<COLS;x++){const current=grid[y][x]?1:0;if(current!==previous)rowTransitions++;previous=current;}\\n      if(previous!==1)rowTransitions++;\\n    }\\n    for(let x=0;x<COLS;x++){\\n      let previous=1;\\n      for(let y=0;y<ROWS;y++){const current=grid[y][x]?1:0;if(current!==previous)columnTransitions++;previous=current;}\\n      if(previous!==1)columnTransitions++;\\n    }\\n    for(let x=0;x<COLS;x++){\\n      let depth=0;\\n      for(let y=0;y<ROWS;y++){\\n        const left=x===0?1:(grid[y][x-1]?1:0),right=x===COLS-1?1:(grid[y][x+1]?1:0);\\n        if(!grid[y][x]&&left&&right){depth++;cumulativeWells+=depth;}else depth=0;\\n      }\\n    }\\n    const aggregateHeight=heights.reduce((sum,height)=>sum+height,0),maxHeight=Math.max(...heights);\\n    let bumpiness=0;const differences=[];\\n    for(let x=0;x<COLS-1;x++){const difference=heights[x]-heights[x+1];bumpiness+=Math.abs(difference);differences.push(difference);}\\n    return {heights,aggregateHeight,maxHeight,bumpiness,holes,holeDepth,rowsWithHoles:rowsWithHoles.size,blocksAboveHoles,rowTransitions,columnTransitions,cumulativeWells,patternDiversity:new Set(differences).size};\\n  }\\n\\n  function expertSimulatePlacement(grid,shapeIndex,rotation,x){\\n    const m=rotation.m;let y=-3;\\n    while(expertCanPlace(grid,m,x,y+1))y++;\\n    if(!expertCanPlace(grid,m,x,y))return null;\\n    const nextGrid=grid.map(row=>row.slice()),pieceCells=[];let topped=false,minPieceY=4,maxPieceY=-1;\\n    for(let py=0;py<4;py++)for(let px=0;px<4;px++)if(m[py][px]){\\n      minPieceY=Math.min(minPieceY,py);maxPieceY=Math.max(maxPieceY,py);\\n      const gx=x+px,gy=y+py;\\n      if(gy<0)topped=true;else{nextGrid[gy][gx]=SHAPES[shapeIndex].color;pieceCells.push([gx,gy]);}\\n    }\\n    const fullRows=[];\\n    for(let row=0;row<ROWS;row++)if(nextGrid[row].every(Boolean))fullRows.push(row);\\n    let removedPieceCells=0;\\n    for(const cell of pieceCells)if(fullRows.includes(cell[1]))removedPieceCells++;\\n    for(const row of fullRows.slice().sort((a,b)=>b-a))nextGrid.splice(row,1);\\n    while(nextGrid.length<ROWS)nextGrid.unshift(Array(COLS).fill(null));\\n    const landingHeight=ROWS-(y+(minPieceY+maxPieceY)/2);\\n    return {grid:nextGrid,x,y,rot:rotation.rot,m:cloneMatrix(m),lines:fullRows.length,erodedPieceCells:fullRows.length*removedPieceCells,landingHeight,topped};\\n  }\\n\\n  function expertPlacementScore(candidate,difficulty,game){\\n    const f=expertBoardFeatures(candidate.grid),attack=[0,1,2,4,6][candidate.lines]||7;\\n    const opponentHeight=game&&game.player?game.player.maxHeight:0,pressure=opponentHeight>=13?1.30:opponentHeight>=10?1.15:1;\\n    const aggression=difficulty==='impossible'?1.28:1.08,danger=Math.max(0,f.maxHeight-13);\\n    let score=0;\\n    score+=candidate.lines*17+attack*15*aggression*pressure+candidate.erodedPieceCells*2.1;\\n    score-=candidate.landingHeight*.55+f.aggregateHeight*.30+f.maxHeight*.78+f.bumpiness*.28;\\n    score-=f.rowTransitions*.68+f.columnTransitions*1.02+f.cumulativeWells*.42;\\n    score-=f.holes*15.5+f.holeDepth*1.35+f.rowsWithHoles*3.6+f.blocksAboveHoles*2.8;\\n    score-=danger*danger*8.5+f.patternDiversity*.12;\\n    if(f.holes===0&&candidate.lines===4)score+=32;\\n    if(candidate.topped)score-=1000000;\\n    return score;\\n  }\\n\\n  function expertPlacements(grid,shapeIndex,difficulty,game){\\n    const candidates=[];\\n    for(const rotation of ROTATIONS[shapeIndex])for(let x=-2;x<COLS+2;x++){\\n      const candidate=expertSimulatePlacement(grid,shapeIndex,rotation,x);\\n      if(candidate){candidate.score=expertPlacementScore(candidate,difficulty,game);candidates.push(candidate);}\\n    }\\n    candidates.sort((a,b)=>b.score-a.score||b.lines-a.lines||a.landingHeight-b.landingHeight);\\n    return candidates;\\n  }\\n\\n  function expertFutureValue(grid,preview,difficulty,game,depth,beam){\\n    if(depth<=0||!preview.length)return 0;\\n    const candidates=expertPlacements(grid,preview[0],difficulty,game);\\n    if(!candidates.length)return -1000000;\\n    let best=-Infinity;\\n    for(const candidate of candidates.slice(0,beam)){\\n      const value=candidate.score+.72*expertFutureValue(candidate.grid,preview.slice(1),difficulty,game,depth-1,beam);\\n      if(value>best)best=value;\\n    }\\n    return best;\\n  }\\n\\n  function chooseBotPlan(board,shapeIndex,difficulty,preview=[],game=null){\\n    const d=DIFFICULTIES[difficulty];\\n    if(difficulty!=='hard'&&difficulty!=='impossible'){\\n      const candidates=[];\\n      for(const rotation of ROTATIONS[shapeIndex])for(let x=-2;x<COLS+2;x++){\\n        const candidate=simulatePlacement(board,shapeIndex,rotation,x);if(candidate)candidates.push(candidate);\\n      }\\n      candidates.sort((a,b)=>b.score-a.score);\\n      if(!candidates.length)return {x:3,rot:0,m:cloneMatrix(SHAPES[shapeIndex].m),score:-999};\\n      let pool=Math.min(d.choice,candidates.length),pick=0;\\n      if(Math.random()<d.error)pick=Math.min(candidates.length-1,Math.floor(Math.random()*Math.max(2,pool+2)));\\n      else if(pool>1)pick=Math.floor(Math.pow(Math.random(),2)*pool);\\n      return candidates[pick];\\n    }\\n    const depth=difficulty==='impossible'?3:2,rootLimit=difficulty==='impossible'?18:24,beam=difficulty==='impossible'?6:10;\\n    const roots=expertPlacements(board.grid,shapeIndex,difficulty,game);\\n    if(!roots.length)return {x:3,rot:0,m:cloneMatrix(SHAPES[shapeIndex].m),score:-999};\\n    let best=roots[0],bestValue=-Infinity;\\n    for(const candidate of roots.slice(0,rootLimit)){\\n      const value=candidate.score+.72*expertFutureValue(candidate.grid,preview,difficulty,game,depth-1,beam);\\n      if(value>bestValue){bestValue=value;best=candidate;}\\n    }\\n    best.score=bestValue;return best;\\n  }\"\n    );\n\n    html=patch(html,'expert preview planning',\n      \"this.plan=chooseBotPlan(this.game.bot,shapeIndex,this.game.difficulty);\",\n      \"this.plan=chooseBotPlan(this.game.bot,shapeIndex,this.game.difficulty,this.game.queue.slice(0,2),this.game);\"\n    );\n    html=patch(html,'expert rotation replan',\n      \"if(!ok){ this.plan=chooseBotPlan(board,board.active.shapeIndex,game.difficulty); }\",\n      \"if(!ok){ this.plan=chooseBotPlan(board,board.active.shapeIndex,game.difficulty,game.queue.slice(0,2),game); }\"\n    );\n    html=patch(html,'expert movement replan',\n      \"if(!ok)this.plan=chooseBotPlan(board,board.active.shapeIndex,game.difficulty);\",\n      \"if(!ok)this.plan=chooseBotPlan(board,board.active.shapeIndex,game.difficulty,game.queue.slice(0,2),game);\"\n    );\n    html=patch(html,'strategic expert rushing',\n      \"this.willForce=Math.random()<d.forceChance;\",\n      \"this.willForce=this.game.difficulty==='impossible'?(this.plan.lines>0||this.game.player.maxHeight>=10||Math.random()<d.forceChance):this.game.difficulty==='hard'?(this.plan.lines>=2||this.game.player.maxHeight>=13||Math.random()<d.forceChance):Math.random()<d.forceChance;\"\n    );\n";
    launcher=launcher.replace(marker,"    html=html.replace(\"rush:'No Bot Rush'\",\"rush:'No Manual Bot Rush'\");\n"+botPatches+"\n`;");
    document.open();document.write(launcher);document.close();
  }catch(error){
    document.getElementById('boot').innerHTML='<div><b>GAME COULD NOT LOAD</b><span>'+String(error&&error.message||error)+'</span></div>';
  }
})();
</script>
</body>
</html>
