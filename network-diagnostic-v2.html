<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050711">
<title>Rush Duel Network Diagnostic V2</title>
<style>
:root{color-scheme:dark;--bg:#050711;--panel:#10172a;--line:#33446e;--text:#eef5ff;--muted:#94a7c8;--cyan:#63e9ff;--green:#6cffae;--yellow:#ffe07a;--red:#ff7895}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 0,#15264b 0,#050711 42%);color:var(--text);font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.shell{width:min(900px,100%);margin:auto;padding:14px}.card{border:1px solid var(--line);background:rgba(8,13,28,.96);padding:18px;box-shadow:0 20px 70px #0008}.kicker{color:var(--cyan);font-size:11px;letter-spacing:.16em}.title{font-size:clamp(28px,8vw,52px);line-height:.95;margin:8px 0}.sub{color:var(--muted);font-size:13px;line-height:1.45;margin:0}.build{display:inline-block;margin-top:10px;border:1px solid var(--line);padding:5px 8px;color:var(--yellow);font-size:11px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.join{display:grid;grid-template-columns:1fr auto;gap:8px}button,input{min-height:50px;border:1px solid #5870a6;background:#17213c;color:#fff;padding:10px;font:inherit;font-weight:800}button{cursor:pointer}button.primary{background:#0b6777;border-color:#55e7ff}button.warn{background:#65283e;border-color:#ff7895}button:disabled{opacity:.45;cursor:not-allowed}input{text-align:center;text-transform:uppercase;letter-spacing:.18em;font-size:18px;min-width:0}.role{display:none;margin-top:14px;border:1px solid #536b9f;background:#0a1021;padding:14px}.role.active{display:block}.role-title{font-size:12px;color:var(--cyan)}.room{font-size:clamp(34px,11vw,68px);font-weight:1000;letter-spacing:.13em;text-align:center;color:var(--yellow);margin:6px 0}.notice{padding:10px;border:1px solid #596d98;background:#111a31;color:#dce8ff;font-size:12px;line-height:1.5}.notice strong{color:var(--yellow)}.share{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.share input{font-size:11px;text-transform:none;letter-spacing:0;text-align:left}.summary{margin-top:14px;border:1px solid var(--line);background:#0b1122;padding:12px}.summary strong{display:block;color:var(--cyan);margin-bottom:5px}.summary span{font-size:12px;color:var(--muted);line-height:1.45}.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:14px}.check{border:1px solid var(--line);background:var(--panel);padding:11px}.check.pass{border-color:#2c8c65}.check.fail{border-color:#a84460}.check.working{border-color:#9d8031}.head{display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:900}.state{font-size:9px;color:var(--muted)}.pass .state{color:var(--green)}.fail .state{color:var(--red)}.working .state{color:var(--yellow)}.detail{font-size:10px;color:var(--muted);line-height:1.4;margin-top:7px;word-break:break-word}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.log{height:250px;overflow:auto;white-space:pre-wrap;border:1px solid var(--line);background:#03050b;padding:10px;margin-top:12px;color:#bdcae4;font-size:10px;line-height:1.4}@media(max-width:700px){.controls,.checks,.join,.share{grid-template-columns:1fr}.shell{padding:9px}}
</style>
</head>
<body><main class="shell"><section class="card">
<div class="kicker">RUSH DUEL · TWO-DEVICE TEST</div><h1 class="title">Network Diagnostic V2</h1>
<p class="sub">This version locks each page to one role. Device A must remain the host while Device B joins. A page cannot replace its own host anymore.</p><div class="build" id="build"></div>
<div class="controls" id="controls"><button class="primary" id="hostBtn">DEVICE A · CREATE ROOM</button><div class="join"><input id="code" maxlength="6" placeholder="ROOM CODE"><button id="joinBtn">DEVICE B · JOIN</button></div></div>
<section class="role" id="rolePanel"><div class="role-title" id="roleTitle"></div><div class="room" id="room">------</div><div class="notice" id="roleNotice"></div><div class="share" id="shareBox"><input id="guestLink" readonly><button id="copyLink">Copy Guest Link</button></div></section>
<div class="summary"><strong id="headline">Ready</strong><span id="summary">Use two separate devices. Do not host and join from the same phone or tab.</span></div>
<div class="checks" id="checks"></div><div class="tools"><button id="copyReport">Copy Diagnostic Report</button><button class="warn" id="reset">Reset This Device</button></div><pre class="log" id="log"></pre>
</section></main>
<script>
(()=>{'use strict';
const BUILD='diag-v2-20260731-2305',VERSION=2,PREFIX='rush-duel-diag-v2-',SOURCES=['https://cdn.pubnub.com/sdk/javascript/pubnub.12.0.2.min.js','https://cdn.jsdelivr.net/npm/pubnub@12.0.2/dist/web/pubnub.min.js'];
const $=id=>document.getElementById(id),alphabet='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
let deviceId=localStorage.getItem('rush-duel-diag-device-v2');if(!deviceId){deviceId=randomId('device');localStorage.setItem('rush-duel-diag-device-v2',deviceId);} 
const names=[['page','Page/build'],['internet','Relay reachability'],['sdk','SDK load'],['subscribe','Subscription'],['publish','Publish acknowledgement'],['loopback','Self loopback'],['remote','Other device seen'],['pair','Pairing handshake'],['latency','Round-trip latency'],['lifecycle','Page lifecycle']];
const state={role:'',room:'',userId:'',session:'',channel:'',pubnub:null,listener:null,subscribed:false,selfNonce:'',selfSeen:false,remoteId:'',remoteDevice:'',paired:false,latency:0,heartbeat:0,joinLoop:0,pingLoop:0,logs:[],messages:[],statuses:[],steps:{},startedAt:0};
function randomId(prefix='id'){const a=new Uint32Array(3);crypto.getRandomValues(a);return prefix+'-'+[...a].map(n=>n.toString(36)).join('-');}
function makeCode(){const a=new Uint8Array(6);crypto.getRandomValues(a);return [...a].map(n=>alphabet[n%alphabet.length]).join('');}
function cleanCode(v){return String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);}
function log(msg,data){const line=new Date().toISOString().slice(11,23)+' '+msg+(data===undefined?'':' '+JSON.stringify(data));state.logs.push(line);if(state.logs.length>400)state.logs.shift();$('log').textContent=state.logs.join('\n');$('log').scrollTop=$('log').scrollHeight;}
function setStep(id,status,detail){state.steps[id]={state:status,detail};const el=$('step-'+id);if(el){el.className='check '+status;el.querySelector('.state').textContent=status.toUpperCase();el.querySelector('.detail').textContent=detail;}log('STEP '+id+' '+status,detail);}
function headline(title,text){$('headline').textContent=title;$('summary').textContent=text;}
function flatten(value,depth=0){if(value==null||depth>4)return value;if(value instanceof Error)return{name:value.name,message:value.message,stack:value.stack};if(Array.isArray(value))return value.slice(0,20).map(v=>flatten(v,depth+1));if(typeof value==='object'){const out={};for(const k of Object.keys(value).slice(0,40)){try{out[k]=flatten(value[k],depth+1);}catch{}}return out;}return value;}
function resetSteps(){for(const [id] of names)setStep(id,'pending','Not started.');setStep('page','pass',BUILD+' · '+location.href);setStep('lifecycle','pass','Visible: '+document.visibilityState+'; online: '+navigator.onLine);}
function cleanup(){clearInterval(state.heartbeat);clearInterval(state.joinLoop);clearInterval(state.pingLoop);try{state.pubnub?.removeListener(state.listener);}catch{}try{state.pubnub?.unsubscribeAll();state.pubnub?.destroy();}catch{}state.pubnub=null;state.listener=null;state.subscribed=false;}
function lockRole(){document.querySelectorAll('#controls button,#controls input').forEach(el=>el.disabled=true);$('rolePanel').classList.add('active');$('roleTitle').textContent=state.role==='host'?'DEVICE A · HOST LOCKED':'DEVICE B · GUEST LOCKED';$('room').textContent=state.room;$('roleNotice').innerHTML=state.role==='host'?'<strong>KEEP THIS PAGE OPEN.</strong> Do not press Join on this device. Open the guest link on a different phone, tablet, or computer.':'This device is the guest. The host must remain open on another device.';$('shareBox').style.display=state.role==='host'?'grid':'none';if(state.role==='host')$('guestLink').value=location.origin+location.pathname+'?join='+state.room+'&build='+encodeURIComponent(BUILD);}
function report(){return{generatedAt:new Date().toISOString(),build:BUILD,url:location.href,role:state.role,room:state.room,deviceId,userId:state.userId,session:state.session,remoteId:state.remoteId,remoteDevice:state.remoteDevice,paired:state.paired,latencyMs:state.latency,visibility:document.visibilityState,online:navigator.onLine,userAgent:navigator.userAgent,steps:state.steps,statuses:state.statuses,messages:state.messages.slice(-100),logs:state.logs};}
async function copyText(text,done){try{await navigator.clipboard.writeText(text);}catch{const a=document.createElement('textarea');a.value=text;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();}headline(done,'Paste it into ChatGPT.');}
async function internet(){setStep('internet','working','Testing PubNub time endpoint.');const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);try{const r=await fetch('https://ps.pndsn.com/time/0?diag='+Date.now(),{cache:'no-store',signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status);setStep('internet','pass','HTTP '+r.status+' · '+(await r.text()).slice(0,80));}finally{clearTimeout(t);}}
function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script'),timer=setTimeout(()=>reject(new Error('SDK timeout '+src)),12000);s.src=src+'?diag='+encodeURIComponent(BUILD);s.async=true;s.onload=()=>{clearTimeout(timer);window.PubNub?resolve(src):reject(new Error('Loaded without PubNub'));};s.onerror=()=>{clearTimeout(timer);reject(new Error('SDK network error '+src));};document.head.appendChild(s);});}
async function sdk(){if(window.PubNub){setStep('sdk','pass','PubNub already loaded.');return;}setStep('sdk','working','Loading SDK.');let last;for(const src of SOURCES){try{const used=await loadScript(src);setStep('sdk','pass',used);return;}catch(e){last=e;log('SDK SOURCE FAILED',flatten(e));}}throw last||new Error('SDK unavailable');}
function waitFor(fn,ms,message){return new Promise((resolve,reject)=>{const start=Date.now(),timer=setInterval(()=>{if(fn()){clearInterval(timer);resolve();}else if(Date.now()-start>ms){clearInterval(timer);reject(new Error(message));}},80);});}
function status(event){state.statuses.push({at:new Date().toISOString(),event:flatten(event)});log('STATUS',flatten(event));if(['PNConnectedCategory','PNReconnectedCategory'].includes(event?.category)){state.subscribed=true;setStep('subscribe','pass',event.category+' · '+state.channel);}else if(String(event?.category||'').includes('Error')||String(event?.category||'').includes('Denied'))setStep('subscribe','fail',JSON.stringify(flatten(event)).slice(0,500));}
async function publish(payload){const message={app:'rush-duel-diag',v:VERSION,build:BUILD,room:state.room,deviceId,from:state.userId,at:Date.now(),mid:randomId('m'),...payload};log('PUBLISH '+message.type,message);try{const r=await state.pubnub.publish({channel:state.channel,message,storeInHistory:false,sendByPost:true});setStep('publish','pass','Acknowledged · '+(r?.timetoken||'timetoken returned'));return r;}catch(e){setStep('publish','fail',JSON.stringify(flatten(e)).slice(0,500));throw e;}}
function message(event){const m=event?.message;if(!m||m.app!=='rush-duel-diag'||m.v!==VERSION||m.room!==state.room)return;state.messages.push({at:new Date().toISOString(),publisher:event.publisher,message:m});log('RECEIVE '+m.type,m);if(m.build!==BUILD){setStep('remote','fail','Build mismatch: '+m.build);return;}if(m.type==='self'&&m.from===state.userId&&m.nonce===state.selfNonce){state.selfSeen=true;setStep('loopback','pass','Own publish returned through subscription.');return;}if(m.from===state.userId)return;if(m.deviceId===deviceId){setStep('remote','fail','Host and guest are using the same browser/device ID. Use another device.');headline('Same device detected','The host and guest must stay open on two separate devices.');return;}setStep('remote','pass','Received '+m.type+' from another device.');if(m.to&&m.to!==state.userId)return;
if(state.role==='host'&&m.type==='join-request'){state.remoteId=m.from;state.remoteDevice=m.deviceId;if(state.paired){publish({type:'paired',to:m.from,session:m.session}).catch(()=>{});return;}publish({type:'join-accept',to:m.from,session:m.session,host:state.userId}).catch(()=>{});}
else if(state.role==='guest'&&m.type==='host-alive'){state.remoteId=m.from;state.remoteDevice=m.deviceId;}
else if(state.role==='guest'&&m.type==='join-accept'&&m.session===state.session){state.remoteId=m.from;state.remoteDevice=m.deviceId;publish({type:'join-confirm',to:m.from,session:state.session}).catch(()=>{});}
else if(state.role==='host'&&m.type==='join-confirm'&&m.session){state.remoteId=m.from;state.remoteDevice=m.deviceId;state.session=m.session;state.paired=true;setStep('pair','pass','Host received guest confirmation.');headline('Two devices paired','The relay handshake completed successfully.');publish({type:'paired',to:m.from,session:m.session}).catch(()=>{});startPing();}
else if(state.role==='guest'&&m.type==='paired'&&m.session===state.session){state.paired=true;clearInterval(state.joinLoop);setStep('pair','pass','Guest received final host confirmation.');headline('Two devices paired','The relay handshake completed successfully.');startPing();}
else if(m.type==='ping'){publish({type:'pong',to:m.from,session:m.session,pingId:m.pingId,sentAt:m.sentAt}).catch(()=>{});}
else if(m.type==='pong'&&m.session===state.session){state.latency=Math.max(1,Date.now()-Number(m.sentAt||Date.now()));setStep('latency','pass',state.latency+' ms relay round trip');}}
function startPing(){clearInterval(state.pingLoop);const run=()=>state.paired&&state.remoteId&&publish({type:'ping',to:state.remoteId,session:state.session,pingId:randomId('p'),sentAt:Date.now()}).catch(()=>{});run();state.pingLoop=setInterval(run,3000);}
async function start(role,room){cleanup();state.role=role;state.room=room;state.userId=randomId(role);state.session=randomId('session');state.channel=PREFIX+room.toLowerCase();state.remoteId='';state.remoteDevice='';state.paired=false;state.latency=0;state.logs=[];state.messages=[];state.statuses=[];state.steps={};state.selfNonce=randomId('loop');state.selfSeen=false;state.startedAt=Date.now();lockRole();resetSteps();headline('Starting '+role+' test',room);
try{await internet();await sdk();setStep('subscribe','working','Subscribing to '+state.channel);state.pubnub=new window.PubNub({publishKey:'demo',subscribeKey:'demo',userId:state.userId,ssl:true,restore:true,autoNetworkDetection:true,listenToBrowserNetworkEvents:true,enableEventEngine:true,suppressLeaveEvents:true});state.listener={status,message};state.pubnub.addListener(state.listener);state.pubnub.subscribe({channels:[state.channel]});await waitFor(()=>state.subscribed,15000,'Subscription did not connect.');setStep('publish','working','Sending self-test.');setStep('loopback','working','Waiting for self-test return.');await publish({type:'self',nonce:state.selfNonce});await waitFor(()=>state.selfSeen,12000,'Self-message did not return.');if(role==='host'){setStep('remote','working','Waiting for Device B.');setStep('pair','working','Waiting for join request.');await publish({type:'host-alive'});state.heartbeat=setInterval(()=>publish({type:'host-alive'}).catch(()=>{}),1800);headline('Host is ready','Keep Device A visible. Open the copied guest link on Device B.');}else{setStep('remote','working','Waiting for host heartbeat or acceptance.');setStep('pair','working','Sending join requests.');const join=()=>publish({type:'join-request',session:state.session}).catch(()=>{});join();state.joinLoop=setInterval(join,1300);setTimeout(()=>{if(!state.paired){setStep('pair','fail','No pairing after 25 seconds. Copy reports from both devices.');headline('Pairing failed','Copy the report from Device A and Device B.');}},25000);}}
catch(e){log('START FAILED',flatten(e));headline('Stopped at failed checkpoint',e?.message||String(e));}}
for(const [id,label] of names){const el=document.createElement('div');el.className='check';el.id='step-'+id;el.innerHTML='<div class="head"><span>'+label+'</span><span class="state">PENDING</span></div><div class="detail">Not started.</div>';$('checks').appendChild(el);}resetSteps();$('build').textContent='BUILD '+BUILD;
$('hostBtn').onclick=()=>start('host',makeCode());$('joinBtn').onclick=()=>{const c=cleanCode($('code').value);if(c.length!==6){headline('Invalid code','Enter all six characters from Device A.');return;}const active=JSON.parse(localStorage.getItem('rush-duel-diag-active-host-v2')||'null');if(active?.room===c&&active?.deviceId===deviceId){headline('Same device blocked','This browser created that host. Keep it open and join from a different device.');setStep('remote','fail','Attempted to replace this device’s host with its own guest.');return;}start('guest',c);};
$('hostBtn').addEventListener('click',()=>setTimeout(()=>localStorage.setItem('rush-duel-diag-active-host-v2',JSON.stringify({room:state.room,deviceId,at:Date.now()})),0));$('code').oninput=e=>e.target.value=cleanCode(e.target.value);$('copyLink').onclick=()=>copyText($('guestLink').value,'Guest link copied');$('copyReport').onclick=()=>copyText(JSON.stringify(report(),null,2),'Diagnostic report copied');$('reset').onclick=()=>{cleanup();localStorage.removeItem('rush-duel-diag-active-host-v2');location.href=location.pathname+'?build='+encodeURIComponent(BUILD);};
document.addEventListener('visibilitychange',()=>{setStep('lifecycle',document.visibilityState==='visible'?'pass':'working','Visibility: '+document.visibilityState+'. Keep the host visible.');log('VISIBILITY',document.visibilityState);});window.addEventListener('online',()=>setStep('lifecycle','pass','Browser online.'));window.addEventListener('offline',()=>setStep('lifecycle','fail','Browser offline.'));window.addEventListener('error',e=>log('WINDOW ERROR',flatten(e.error||e.message)));window.addEventListener('unhandledrejection',e=>log('UNHANDLED',flatten(e.reason)));
const auto=cleanCode(new URLSearchParams(location.search).get('join'));if(auto){$('code').value=auto;headline('Guest link opened','Press DEVICE B · JOIN. The host must remain open on Device A.');}
})();
</script></body></html>
