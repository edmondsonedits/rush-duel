<body data-screen="story" data-mode="story">
  <div id="app" class="app-shell"></div>
  <script type="module">
    import * as Core from './assets/core-v13.js?v=69';
    window.__RUSH_MODULES={...Core};
    window.__rushDuel={showScreen(name){document.body.dataset.screen=name;document.querySelectorAll('[data-screen-panel]').forEach(panel=>panel.classList.toggle('active',panel.dataset.screenPanel===name));}};
    const load=src=>new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=src;script.onload=resolve;script.onerror=()=>reject(new Error('Could not load '+src));document.head.appendChild(script);});
    await load('./assets/challenge-pack-v51.js?v=51');
    await load('./assets/story-mode-v69.js?v=69');
    window.__rushDuelStory?.start?.();
  </script>
