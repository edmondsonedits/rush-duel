name: Verify Developer Mode V39

on:
  push:
    paths:
      - '.github/workflows/qa-v39.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts and production loader
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/challenge-color-launch-v38.js
          node --check assets/developer-mode-v38.js
          node --check assets/developer-editor-bridge-v38.js
          node --check assets/developer-unlock-touch-v38.js
          node --check assets/app-v13.js
          grep -q "TYPE_COLORS" assets/challenge-color-launch-v38.js
          grep -q "QWERTY" assets/developer-mode-v38.js
          grep -q "Copy all 10 challenges" assets/developer-mode-v38.js
          grep -q "developer-level-edit" assets/developer-mode-v38.js
          grep -q "developer-editor-bridge-v38.js?v=39" assets/app-v13.js
          grep -q "developer-unlock-touch-v38.js?v=39" assets/app-v13.js
          grep -q "POLISHED BUILD V39" index.html
          grep -q "assets/app-v13.js?v=39" index.html
      - name: Record verification
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/qa-v39.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Verify Developer Mode V39'
          git push
