name: Crush Climb Phase 1

on:
  push:
    branches:
      - crush-climb-phase1-core
    paths:
      - 'crush-climb/**'
      - '.github/workflows/crush-climb-phase1.yml'
  pull_request:
    paths:
      - 'crush-climb/**'
      - '.github/workflows/crush-climb-phase1.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crush-climb
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Vitest regression suite
        run: npm test

      - name: Vite build
        run: npm run build
