name: Assemble Rush Duel V13

on:
  push:
    branches: [polish/v13-production]
    paths:
      - '.build/v13/**'
      - '.github/workflows/assemble-v13.yml'

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble readable source modules
        run: |
          cat .build/v13/source.tgz.b64.* | base64 --decode > /tmp/v13-source.tgz
          tar -xzf /tmp/v13-source.tgz
          rm -rf .build/v13
          rm -f .github/workflows/assemble-v13.yml
      - name: Commit assembled source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Assemble readable Rush Duel V13 source"
          git push
