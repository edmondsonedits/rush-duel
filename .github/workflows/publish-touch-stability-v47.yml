name: Publish touch stability fix V47

on:
  push:
    paths:
      - '.github/workflows/publish-touch-stability-v47.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: touch-stability-v47
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate touch-path scripts
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/challenge-order-ui-v45.js
          node --check assets/challenge-analytics-label-v44.js
          node --check assets/developer-access-guard-v46.js
          node --check assets/developer-unlock-touch-v38.js
          node --check assets/app-v13.js
          ! grep -q "new MutationObserver(sync).observe(document.body" assets/challenge-order-ui-v45.js
          grep -q "runLimitedSyncs" assets/challenge-order-ui-v45.js
          grep -q "disconnect permanently" assets/developer-access-guard-v46.js
          grep -q "challenge-order-ui-v45.js?v=47" assets/app-v13.js
          grep -q "challenge-analytics-label-v44.js?v=47" assets/app-v13.js
          grep -q "developer-access-guard-v46.js?v=47" assets/app-v13.js

      - name: Publish Build V47
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('index.html')
          text=path.read_text()
          text=text.replace('POLISHED BUILD V46','POLISHED BUILD V47')
          text=text.replace('assets/app-v13.js?v=46','assets/app-v13.js?v=47')
          path.write_text(text)
          PY
          grep -q 'POLISHED BUILD V47' index.html
          grep -q 'assets/app-v13.js?v=47' index.html
          rm -f .github/workflows/publish-touch-stability-v47.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix recursive UI observer and restore reliable touch input V47'
          git push
