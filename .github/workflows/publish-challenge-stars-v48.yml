name: Publish challenge stars V48

on:
  push:
    paths:
      - '.github/workflows/publish-challenge-stars-v48.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: challenge-stars-v48
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate challenge star build
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/challenge-stars-v48.js
          node --check assets/app-v13.js
          grep -q "challenge-stars-v48.js?v=48" assets/app-v13.js
          grep -q "POLISHED BUILD V48" index.html
          grep -q "assets/app-v13.js?v=48" index.html
          grep -q "THREE_STAR_LIMIT_MS=10\*60\*1000" assets/challenge-stars-v48.js
          grep -q "challenge-star-total" assets/challenge-stars-v48.js
          grep -q "challengeStarHelpDialog" assets/challenge-stars-v48.js

      - name: Publish Build V48
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/publish-challenge-stars-v48.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish challenge star progression V48'
          git push
