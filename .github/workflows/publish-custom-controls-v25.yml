name: Publish Custom Mode control parity V25

on:
  push:
    paths:
      - '.github/workflows/publish-custom-controls-v25.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: custom-controls-v25
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Match Custom Mode controls and block mobile long press
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          custom_js_path = Path('assets/custom-mode-v23.js')
          custom_css_path = Path('assets/custom-mode-v23.css')
          loader_path = Path('assets/app-v13.js')
          index_path = Path('index.html')

          js = custom_js_path.read_text()

          # Keep the existing side rail focused on challenge information. Pause belongs
          # in the same lower control row used by every other game mode.
          js = js.replace('            <button id="customPauseButton">Ⅱ Pause</button>\n', '')

          controls_pattern = re.compile(
              r'        <section class="custom-controls" aria-label="Custom challenge controls">.*?        </section>\n      </main>`;',
              re.S,
          )
          controls_replacement = '''        <section class="controls custom-controls" aria-label="Custom challenge controls">
          <div class="control-row major custom-control-row custom-control-major">
            <button data-custom-action="ccw" aria-label="Rotate left">↶<small>Rotate</small></button>
            <button data-custom-action="drop" class="rush custom-drop-button" aria-label="Hard drop"><span>HARD DROP</span><small>Lock active piece</small></button>
            <button data-custom-action="cw" aria-label="Rotate right">↷<small>Rotate</small></button>
          </div>
          <div class="control-row movement custom-control-row">
            <button data-custom-action="left" aria-label="Move left">←<small>Move</small></button>
            <button data-custom-action="down" aria-label="Soft drop">↓<small>Soft</small></button>
            <button data-custom-action="right" aria-label="Move right">→<small>Move</small></button>
            <button data-custom-action="pause" id="customPauseButton" aria-label="Pause challenge">Ⅱ<small>Pause</small></button>
          </div>
        </section>
      </main>`;'''
          js, replacements = controls_pattern.subn(controls_replacement, js, count=1)
          if replacements != 1:
              raise SystemExit('Could not replace the Custom Mode control layout')

          # Use the exact movement repeat values from the regular modes: DAS 115 ms,
          # horizontal ARR 32 ms and soft-drop repeat 22 ms.
          old_repeat = "repeatTimer=setInterval(()=>customAction(action),action==='down'?45:55);},160);"
          new_repeat = "repeatTimer=setInterval(()=>customAction(action),action==='down'?22:32);},115);"
          if old_repeat not in js:
              raise SystemExit('Custom hold-repeat code was not found')
          js = js.replace(old_repeat, new_repeat, 1)

          # Pause now uses the same pointer-down binding and pressed-state feedback as
          # every other gameplay button, while remaining able to resume a paused game.
          js = js.replace("  $c('customPauseButton')?.addEventListener('click',toggleCustomPause);\n", '')
          action_gate = "function customAction(action){\n  if(!isPlayActive()||play.paused)return false;"
          action_gate_replacement = "function customAction(action){\n  if(action==='pause'){toggleCustomPause();return true;}\n  if(!isPlayActive()||play.paused)return false;"
          if action_gate not in js:
              raise SystemExit('Custom action gate was not found')
          js = js.replace(action_gate, action_gate_replacement, 1)

          old_pause_label = "if($c('customPauseButton'))$c('customPauseButton').textContent=play.paused?'▶ Resume':'Ⅱ Pause';tone('move');"
          new_pause_label = "if($c('customPauseButton'))$c('customPauseButton').innerHTML=play.paused?'▶<small>Resume</small>':'Ⅱ<small>Pause</small>';tone('move');"
          if old_pause_label not in js:
              raise SystemExit('Pause label updater was not found')
          js = js.replace(old_pause_label, new_pause_label, 1)

          # Match the regular gameplay swipe thresholds.
          js = js.replace('Math.round(ax/34)', 'Math.round(ax/35)')
          js = js.replace('else if(dy>20)', 'else if(dy>22)')
          js = js.replace("link.href='assets/custom-mode-v23.css?v=23'", "link.href='assets/custom-mode-v23.css?v=25'")
          custom_js_path.write_text(js)

          css = custom_css_path.read_text()
          parity_marker = '/* V25: shared gameplay-control layout and interaction parity. */'
          parity_css = r'''

/* V25: shared gameplay-control layout and interaction parity. */
.custom-play-screen .custom-controls{
  display:grid;
  gap:4px;
  padding:4px;
  border:1px solid #293f62;
  border-radius:11px;
  background:linear-gradient(180deg,rgba(12,22,43,.98),rgba(4,8,18,.99));
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}
.custom-play-screen .custom-control-row{display:grid;gap:4px;}
.custom-play-screen .custom-control-row.custom-control-major{grid-template-columns:1fr 2.15fr 1fr;}
.custom-play-screen .custom-control-row:not(.custom-control-major){grid-template-columns:repeat(4,1fr);}
.custom-play-screen .custom-control-row button,
.custom-play-screen .custom-control-row #customPauseButton{
  min-width:0;
  min-height:50px;
  padding:1px 6px;
  border:2px solid #4d789b;
  border-radius:10px;
  color:#fff;
  background:linear-gradient(180deg,#183b62,#0a1930);
  font-size:clamp(20px,5.5vw,29px);
  font-weight:1000;
  line-height:1;
  text-transform:none;
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
  box-shadow:0 3px 0 #01050b,inset 0 0 15px rgba(85,228,255,.08);
}
.custom-play-screen .custom-control-row button small,
.custom-play-screen .custom-control-row #customPauseButton small{
  display:block;
  margin-top:4px;
  color:#a8bad1;
  font-size:6px;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.custom-play-screen .custom-control-row .custom-drop-button{
  border-color:#ffe36d;
  color:#fff;
  background:linear-gradient(180deg,#f25aab,#a52973 48%,#4b1747);
  font-size:clamp(13px,4vw,22px);
}
.custom-play-screen .custom-control-row .custom-drop-button small{color:#ffeaa2;}
.custom-play-screen .custom-control-row button.active,
.custom-play-screen .custom-control-row #customPauseButton.active{
  transform:translateY(2px);
  filter:brightness(1.25);
  box-shadow:0 1px 0 #01050b;
}
'''
          if parity_marker not in css:
              css += parity_css
          custom_css_path.write_text(css)

          # CSS blocks Android/iOS selection handles and callout menus while retaining
          # normal text selection inside actual form fields.
          interaction_css = r'''/* V25 — prevent accidental long-press selection during play. */
button,
canvas,
.controls,
.controls *,
.custom-controls,
.custom-controls *,
.arena,
.custom-play-stage,
.custom-editor-main{
  -webkit-user-select:none!important;
  user-select:none!important;
  -webkit-touch-callout:none!important;
  -webkit-user-drag:none!important;
}
.controls,
.controls *,
.custom-controls,
.custom-controls *{touch-action:none!important;}
input,
textarea,
[contenteditable="true"]{
  -webkit-user-select:text!important;
  user-select:text!important;
  -webkit-touch-callout:default!important;
}
'''
          Path('assets/mobile-interaction-v25.css').write_text(interaction_css)

          # Event guards cover browsers that still open a context/copy menu despite CSS.
          interaction_js = r'''(()=>{
'use strict';
const protectedSelector='button,canvas,.controls,.custom-controls,.arena,.custom-play-stage,.custom-editor-main';
const protectedTarget=target=>target instanceof Element&&Boolean(target.closest(protectedSelector));
for(const eventName of ['contextmenu','selectstart','dragstart']){
  document.addEventListener(eventName,event=>{
    if(protectedTarget(event.target))event.preventDefault();
  },{capture:true});
}
const markControls=()=>document.querySelectorAll('button,canvas,.controls,.custom-controls').forEach(element=>element.setAttribute('draggable','false'));
markControls();
new MutationObserver(markControls).observe(document.documentElement,{childList:true,subtree:true});
})();
'''
          Path('assets/mobile-interaction-v25.js').write_text(interaction_js)

          loader = loader_path.read_text()
          loader = loader.replace("'./custom-mode-v23.js?v=23'", "'./custom-mode-v23.js?v=25'")
          if "'./mobile-interaction-v25.js?v=25'" not in loader:
              loader = loader.replace("'./custom-mode-v23.js?v=25']", "'./custom-mode-v23.js?v=25','./mobile-interaction-v25.js?v=25']")
          loader_path.write_text(loader)

          index = index_path.read_text()
          css_link = '  <link rel="stylesheet" href="assets/mobile-interaction-v25.css?v=25">\n'
          if 'mobile-interaction-v25.css' not in index:
              anchor = '  <link rel="stylesheet" href="assets/mode-menu-v22.css?v=22">\n'
              if anchor not in index:
                  raise SystemExit('Could not find stylesheet insertion point')
              index = index.replace(anchor, anchor + css_link, 1)
          index = re.sub(r'assets/app-v13\.js\?v=\d+', 'assets/app-v13.js?v=25', index)
          index = re.sub(r'POLISHED BUILD V\d+', 'POLISHED BUILD V25', index)
          index_path.write_text(index)
          PY

          node --check assets/custom-mode-v23.js
          node --check assets/mobile-interaction-v25.js
          test "$(grep -o 'id=\"customPauseButton\"' assets/custom-mode-v23.js | wc -l)" -eq 1
          grep -q 'grid-template-columns:repeat(4,1fr)' assets/custom-mode-v23.css
          grep -q "action==='down'?22:32" assets/custom-mode-v23.js
          grep -q 'mobile-interaction-v25.js?v=25' assets/app-v13.js
          grep -q 'mobile-interaction-v25.css?v=25' index.html

      - name: Commit and publish V25
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/publish-custom-controls-v25.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Match Custom Mode controls and prevent mobile long press V25'
          git push
