name: Install high-resolution Tetris Duel title

on:
  push:
    paths:
      - '.github/workflows/replace-title-hq-v23.yml'
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  install-title:
    if: github.event_name != 'issues' || github.event.issue.title == 'Run high-resolution title installer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and verify the high-resolution title artwork
        shell: bash
        run: |
          set -euo pipefail
          cat assets/title-hq-parts/*.txt | tr -d '\n\r ' | base64 --decode > assets/title-screen-hq.webp
          test "$(wc -c < assets/title-screen-hq.webp)" -eq 131112
          echo "5ee1e5a89ac506392f43aae02fc331997dea1f78e76be4300fe023998e2eff3f  assets/title-screen-hq.webp" | sha256sum -c -
          printf 'width=864\nheight=1536\nformat=webp\nbytes=131112\nsha256=5ee1e5a89ac506392f43aae02fc331997dea1f78e76be4300fe023998e2eff3f\n' > assets/title-screen-hq.meta.txt

      - name: Activate the high-resolution title and bust caches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text()
          html = html.replace('assets/title-screen-exact.png?v=22', 'assets/title-screen-hq.webp?v=23')
          html = html.replace('?v=22', '?v=23')
          html = html.replace('POLISHED BUILD V22', 'POLISHED BUILD V23')
          path.write_text(html)
          PY
          rm -rf assets/title-hq-parts
          rm -f assets/title-installer-diagnostic.txt assets/title-screen-exact.png assets/title-screen-exact.meta.txt

      - name: Commit the live V23 patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Replace title screen with high-resolution artwork V23'
            git push
          fi
