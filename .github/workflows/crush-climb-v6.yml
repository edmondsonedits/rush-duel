name: Validate Crush Climb V7.1

on:
  push:
    branches: [main]
    paths:
      - 'crush-climb/**'
      - '.github/workflows/crush-climb-v6.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check crush-climb/core.js
          node --check crush-climb/runner.js
          node --check crush-climb/ai.js
          node --check crush-climb/render.js
          node --check crush-climb/features.js
          node --check crush-climb/vertical.js
          node --check crush-climb/duel.js
          node --check crush-climb/modes.js
      - name: Check playable wiring
        run: |
          grep -q 'Crush Climb Duel V7.1' crush-climb/index.html
          grep -q 'duel.js' crush-climb/index.html
          grep -q 'modes.js' crush-climb/index.html
          grep -q "classic:'classic'" crush-climb/modes.js
          grep -q "sabotage:'sabotage'" crush-climb/modes.js
          grep -q 'Sabotage Duel — NO LAVA' crush-climb/modes.js
          grep -q 'renderSabotageNoLava' crush-climb/modes.js
          grep -q 'renderClassic' crush-climb/modes.js
          grep -q 'DUEL_SCORE_GOAL=4000' crush-climb/duel.js
          grep -q 'tryRunnerKick' crush-climb/duel.js
          grep -q 'duelToggleDepth' crush-climb/duel.js
          grep -q 'LAVA_GRACE_SECONDS=6' crush-climb/vertical.js
          grep -q 'LAVA_RISE_SPEED_V65=.0222222' crush-climb/vertical.js
          grep -q 'rebaseVertical' crush-climb/vertical.js
          test -s crush-climb/style.css
