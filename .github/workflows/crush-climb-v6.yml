name: Validate Crush Climb V6

on:
  push:
    branches: [main]
    paths:
      - 'crush-climb/**'
      - '.github/workflows/crush-climb-v6.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check crush-climb/core.js
          node --check crush-climb/runner.js
          node --check crush-climb/ai.js
          node --check crush-climb/render.js
          node --check crush-climb/features.js
          node --check crush-climb/vertical.js
      - name: Check playable wiring
        run: |
          grep -q 'Crush Climb Duel V6.5' crush-climb/index.html
          grep -q 'core.js' crush-climb/index.html
          grep -q 'runner.js' crush-climb/index.html
          grep -q 'ai.js' crush-climb/index.html
          grep -q 'render.js' crush-climb/index.html
          grep -q 'features.js' crush-climb/index.html
          grep -q 'vertical.js' crush-climb/index.html
          grep -q 'LAVA_GRACE_SECONDS=6' crush-climb/vertical.js
          grep -q 'LAVA_RISE_SPEED_V65=.0222222' crush-climb/vertical.js
          grep -q 'rebaseVertical' crush-climb/vertical.js
          test -s crush-climb/style.css
