name: Publish exported Challenge pack V42

on:
  push:
    paths:
      - '.github/workflows/publish-challenge-pack-v42.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: challenge-pack-v42
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate exact challenge pack
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/challenge-pack-v42.js
          node --check assets/challenge-pack-ui-v42.js
          node --check assets/developer-challenge-export-v42.js
          node --check assets/app-v13.js
          node <<'NODE'
          global.window={};
          const memory=new Map();
          global.localStorage={
            getItem:key=>memory.has(key)?memory.get(key):null,
            setItem:(key,value)=>memory.set(key,String(value))
          };
          require('./assets/challenge-pack-v42.js');
          const pack=window.__TETRIS_DUEL_CHALLENGE_PACK;
          if(!pack||pack.levels.length!==10)throw new Error('Expected exactly ten challenge levels.');
          const expected=[66,52,33,48,55,29,60,65,47,66];
          pack.levels.forEach((level,index)=>{
            if(level.grid.length!==20||level.grid.some(row=>row.length!==10))throw new Error(`Level ${index+1} is not 10x20.`);
            if(level.blocks!==expected[index])throw new Error(`Level ${index+1} block count ${level.blocks} != ${expected[index]}.`);
          });
          const smiley=new Set(pack.levels[0].grid.flat().filter(Boolean));
          if(!smiley.has('#ffe353')||!smiley.has('#ffe25b'))throw new Error('Smiley custom yellow shades were not preserved.');
          console.log('Validated ten exact public Challenge Mode boards.');
          NODE
          grep -q "challenge-pack-v42.js?v=42" assets/app-v13.js
          grep -q "challenge-pack-ui-v42.js?v=42" assets/app-v13.js
          grep -q "developer-challenge-export-v42.js?v=42" assets/app-v13.js

      - name: Publish Build V42
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('index.html')
          text=path.read_text()
          text=text.replace('POLISHED BUILD V41','POLISHED BUILD V42')
          text=text.replace('assets/app-v13.js?v=41','assets/app-v13.js?v=42')
          path.write_text(text)
          PY
          grep -q 'POLISHED BUILD V42' index.html
          grep -q 'assets/app-v13.js?v=42' index.html
          rm -f .github/workflows/publish-challenge-pack-v42.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish exported ten-level Challenge pack V42'
          git push
