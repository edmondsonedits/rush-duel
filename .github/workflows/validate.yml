name: Validate Rush Duel

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check legacy Story syntax
        run: node --check assets/story-playtest-v72.js && node --check assets/story-playtest-v73.js && node --check assets/story-playtest-v75.js && node --check assets/story-playtest-v76.js && node --check assets/story-playtest-v77.js && node --check assets/story-production-v74.js && node --check assets/story-production-v75.js && node --check assets/story-production-v76.js && node --check assets/story-production-v77.js
      - name: Check current Story V80 syntax
        run: node --check assets/story-playtest-v80.js && node --check assets/story-production-v80.js
      - name: Validate production build
        run: node tests/validate.mjs && node tests/validate-story-editor.mjs && node tests/story-curriculum-validate.mjs
      - name: Validate Custom Assist architecture
        run: node tests/custom-assist-architecture.mjs
      - name: Validate Story strategy foundation
        run: node tests/story-playtest-v76-strategy.mjs
      - name: Validate continuous Story foundation
        run: node tests/story-playtest-v78-continuous.mjs
      - name: Validate current Story V80 runtime
        run: node tests/story-playtest-v80-runtime.mjs
      - name: Verify production routes to Story V80
        run: grep -q "story-production-v80.js?v=80.2" assets/app-v13.js && grep -q "story-playtest-v80.js?v=80.2" story-test.html && grep -q "url.searchParams.set('v','80.2')" assets/story-production-v80.js