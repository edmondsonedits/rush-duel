name: Validate Rush Duel

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Story V72 syntax
        run: node --check assets/story-playtest-v72.js
      - name: Check Story V73 syntax
        run: node --check assets/story-playtest-v73.js
      - name: Check Story production bridge V74 syntax
        run: node --check assets/story-production-v74.js
      - name: Check Story V75 syntax
        run: node --check assets/story-playtest-v75.js && node --check assets/story-production-v75.js
      - name: Validate production build
        run: node tests/validate.mjs && node tests/validate-story-editor.mjs && node tests/story-curriculum-validate.mjs
      - name: Validate Story V73
        run: node tests/story-playtest-v73-validate.mjs
      - name: Validate Story V75 reachability
        run: node tests/story-playtest-v75-reachability.mjs
      - name: Verify production routes to reachable Story Mode
        run: grep -q "story-production-v75.js?v=75" assets/app-v13.js && grep -q "story-test.html" assets/story-production-v75.js && grep -q "story-playtest-v75.js?v=75" story-test.html
